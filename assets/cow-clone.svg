<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="An alien spaceship beams a copy-on-write clone of a cow named node_modules">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2a2f5a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dfcc4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9dfcc4" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f6ff"/>
      <stop offset="1" stop-color="#7cc8e8"/>
    </linearGradient>
    <g id="cow">
      <!-- legs -->
      <rect x="-48" y="18" width="12" height="40" rx="4" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3"/>
      <rect x="-24" y="18" width="12" height="40" rx="4" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3"/>
      <rect x="18" y="18" width="12" height="40" rx="4" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3"/>
      <rect x="40" y="18" width="12" height="40" rx="4" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3"/>
      <rect x="-48" y="52" width="12" height="7" rx="2" fill="#3b3b3b"/>
      <rect x="-24" y="52" width="12" height="7" rx="2" fill="#3b3b3b"/>
      <rect x="18" y="52" width="12" height="7" rx="2" fill="#3b3b3b"/>
      <rect x="40" y="52" width="12" height="7" rx="2" fill="#3b3b3b"/>
      <!-- tail -->
      <path d="M-62 -10 q-18 10 -10 34" fill="none" stroke="#1d1d1d" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-72" cy="26" r="5" fill="#1d1d1d"/>
      <!-- body -->
      <rect x="-64" y="-34" width="128" height="62" rx="28" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3"/>
      <path d="M-40 -33 q16 6 10 22 q-10 14 -26 4 q-8 -14 2 -24 z" fill="#1d1d1d"/>
      <path d="M10 -2 q20 -6 28 10 q-4 16 -22 14 q-14 -8 -6 -24 z" fill="#1d1d1d"/>
      <!-- udder -->
      <ellipse cx="0" cy="28" rx="14" ry="7" fill="#f6a9c0" stroke="#1d1d1d" stroke-width="3"/>
      <!-- head -->
      <g transform="translate(70 -30)">
        <path d="M-14 -20 l-12 -8 l4 14 z" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>
        <path d="M14 -20 l12 -8 l-4 14 z" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>
        <path d="M-8 -26 q-4 -12 -14 -12" fill="none" stroke="#e8d39a" stroke-width="5" stroke-linecap="round"/>
        <path d="M8 -26 q4 -12 14 -12" fill="none" stroke="#e8d39a" stroke-width="5" stroke-linecap="round"/>
        <rect x="-22" y="-28" width="44" height="50" rx="18" fill="#f4f1ea" stroke="#1d1d1d" stroke-width="3"/>
        <ellipse cx="0" cy="14" rx="22" ry="14" fill="#f6a9c0" stroke="#1d1d1d" stroke-width="3"/>
        <circle cx="-7" cy="14" r="3" fill="#1d1d1d"/>
        <circle cx="7" cy="14" r="3" fill="#1d1d1d"/>
        <circle cx="-9" cy="-8" r="4" fill="#1d1d1d"/>
        <circle cx="9" cy="-8" r="4" fill="#1d1d1d"/>
        <circle cx="-8" cy="-9" r="1.4" fill="#fff"/>
        <circle cx="10" cy="-9" r="1.4" fill="#fff"/>
      </g>
      <!-- collar tag -->
      <path d="M50 -6 q20 10 40 0" fill="none" stroke="#c0392b" stroke-width="5"/>
      <rect x="22" y="2" width="96" height="22" rx="6" fill="#ffd34d" stroke="#1d1d1d" stroke-width="2.5"/>
      <text x="70" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#1d1d1d">node_modules</text>
    </g>
  </defs>

  <rect width="800" height="420" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.6"/><circle cx="140" cy="90" r="1.2"/><circle cx="230" cy="30" r="1.8"/>
    <circle cx="330" cy="70" r="1.1"/><circle cx="520" cy="36" r="1.5"/><circle cx="610" cy="96" r="1.2"/>
    <circle cx="700" cy="50" r="1.8"/><circle cx="760" cy="130" r="1.2"/><circle cx="40" cy="170" r="1.3"/>
    <circle cx="190" cy="190" r="1"/><circle cx="740" cy="220" r="1.1"/><circle cx="440" cy="20" r="1.2"/>
  </g>
  <circle cx="110" cy="70" r="26" fill="#f6f0c9"/>
  <circle cx="100" cy="62" r="5" fill="#e3dba8"/><circle cx="120" cy="80" r="4" fill="#e3dba8"/>

  <!-- ground -->
  <path d="M0 340 q200 -24 400 -6 t400 -4 v90 h-800 z" fill="#2f6b3a"/>
  <path d="M0 362 q220 -18 420 -4 t380 2 v60 h-800 z" fill="#275a31"/>

  <!-- beam -->
  <path d="M500 132 L420 352 L700 352 L620 132 Z" fill="url(#beam)"/>
  <ellipse cx="560" cy="352" rx="140" ry="14" fill="#9dfcc4" opacity="0.35"/>

  <!-- original cow on the grass -->
  <use href="#cow" transform="translate(220 300)"/>

  <!-- clone rising in the beam -->
  <g opacity="0.9">
    <use href="#cow" transform="translate(545 250) scale(0.82)"/>
  </g>
  <g fill="#e9fff2">
    <circle cx="470" cy="300" r="3"/><circle cx="650" cy="280" r="2.4"/><circle cx="520" cy="200" r="2.2"/>
    <circle cx="610" cy="190" r="3"/><circle cx="480" cy="230" r="1.8"/><circle cx="660" cy="320" r="2"/>
  </g>

  <!-- dashed link: same blocks -->
  <path d="M330 278 C 400 230, 430 250, 470 250" fill="none" stroke="#9dfcc4" stroke-width="2.5" stroke-dasharray="6 6"/>
  <text x="372" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#9dfcc4">0 bytes copied</text>

  <!-- spaceship -->
  <g transform="translate(560 112)">
    <ellipse cx="0" cy="-16" rx="46" ry="34" fill="url(#dome)" stroke="#1d1d1d" stroke-width="3"/>
    <!-- alien -->
    <g transform="translate(0 -24)">
      <ellipse cx="0" cy="0" rx="15" ry="18" fill="#7ee081" stroke="#1d1d1d" stroke-width="2.5"/>
      <ellipse cx="-6" cy="-2" rx="5" ry="7" fill="#1d1d1d" transform="rotate(-20 -6 -2)"/>
      <ellipse cx="6" cy="-2" rx="5" ry="7" fill="#1d1d1d" transform="rotate(20 6 -2)"/>
      <path d="M-4 10 q4 3 8 0" fill="none" stroke="#1d1d1d" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6 -16 l-6 -12" stroke="#1d1d1d" stroke-width="2.5"/><circle cx="-12" cy="-29" r="3.5" fill="#ffd34d" stroke="#1d1d1d" stroke-width="2"/>
      <path d="M6 -16 l6 -12" stroke="#1d1d1d" stroke-width="2.5"/><circle cx="12" cy="-29" r="3.5" fill="#ffd34d" stroke="#1d1d1d" stroke-width="2"/>
    </g>
    <ellipse cx="0" cy="8" rx="110" ry="26" fill="#a9b4c8" stroke="#1d1d1d" stroke-width="3"/>
    <ellipse cx="0" cy="2" rx="110" ry="14" fill="#c9d2e3"/>
    <ellipse cx="0" cy="20" rx="58" ry="10" fill="#6f7a92" stroke="#1d1d1d" stroke-width="3"/>
    <g fill="#ffd34d" stroke="#1d1d1d" stroke-width="2">
      <circle cx="-80" cy="10" r="6"/><circle cx="80" cy="10" r="6"/>
    </g>
    <text x="0" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">clonefile(2)</text>
  </g>

  <!-- title -->
  <text x="40" y="396" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">cow-clone</text>
  <text x="196" y="396" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#cfe9d6">copy-on-write clones, beamed up in one call</text>
</svg>
